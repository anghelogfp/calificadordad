name: Build Windows Portable EXE

on:
  workflow_dispatch:
  push:
    branches:
      - feat/calificacion-pj
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'reportes-actas/**'
      - 'calificador_pj.spec'
      - 'build_windows_exe.bat'
      - '.github/workflows/build-windows-exe.yml'

jobs:
  build-windows-exe:
    name: Build CalificadorPJ.exe (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend SPA
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller waitress

      - name: Run Backend Unit Tests
        working-directory: backend
        env:
          DJANGO_DEBUG: "true"
          DJANGO_SECRET_KEY: django-insecure-ci-windows-build
        run: python manage.py test

      - name: Package CalificadorPJ.exe with PyInstaller
        run: pyinstaller --clean --noconfirm calificador_pj.spec

      - name: Smoke Test CalificadorPJ.exe on Windows
        run: .\dist\CalificadorPJ.exe --smoke-test

      - name: Prepare Portable Distribution Folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/CalificadorPJ-Portable/data/backups | Out-Null
          Copy-Item dist/CalificadorPJ.exe dist/CalificadorPJ-Portable/CalificadorPJ.exe
          if (Test-Path reportes-actas) {
            Copy-Item -Recurse reportes-actas dist/CalificadorPJ-Portable/reportes-actas
          }

      - name: Upload Windows Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CalificadorPJ-Windows-Portable
          path: dist/CalificadorPJ-Portable/
          if-no-files-found: error
